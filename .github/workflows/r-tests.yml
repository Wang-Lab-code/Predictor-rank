name: R benchmark checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install analysis dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Check syntax and numerical helpers
        run: Rscript tests/check.R
      - name: Exercise all three entry points with synthetic data
        run: Rscript tests/smoke.R
